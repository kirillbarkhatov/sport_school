{% extends 'school/base.html' %}

{% block title %}Удаление счёта{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm mt-4">
            <div class="card-header text-bg-danger">Подтвердите удаление</div>
            <div class="card-body">
                <p>Вы действительно хотите удалить счёт <strong>{{ object.name }}</strong>?</p>
                <p class="text-muted">Отменить действие будет нельзя.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-outline-secondary" href="{% url 'members:family_finance' family.pk %}">Отмена</a>
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
