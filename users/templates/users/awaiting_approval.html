{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Запрос отправлен</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-body-secondary">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header text-center">
                    <h1 class="h4 mb-0">Доступ ожидает подтверждения</h1>
                </div>
                <div class="card-body">
                    <p class="mb-3">
                        Спасибо! Мы получили ваш запрос. После проверки данных и подтверждения доступа вы получите уведомление в Telegram.
                    </p>
                    <p class="text-muted small mb-4">
                        Если есть срочные вопросы, напишите администратору или ответьте в чате бота.
                    </p>
                    <form method="post" action="{% url 'users:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary w-100">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
