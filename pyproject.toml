[tool.poetry]
name = "sport-school"
version = "0.1.0"
description = ""
authors = ["kirill_barkhatov <k.s.barkhatov@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.15"
django = "^6.1"
psycopg = { version = "^3.3", extras = ["binary", "pool"] }
python-dotenv = "^1.2"
pillow = "^13.0"
python-telegram-bot = "^22.8"
djangorestframework = "^3.18"
django-filter = "^26.2"
gunicorn = "^27.0"
django-cors-headers = "^4.9"
packaging = "^26.3"
celery = "^5.7"
redis = "^8.1"
requests = "^2.34"
pyjwt = "^2.15"
django-storages = "^1.14"
boto3 = "^1.44"
openpyxl = "^3.1"
python-docx = "^1.2"


[tool.poetry.group.dev.dependencies]
ipython = "^9.18"
pytest = "^9.2"
pytest-django = "^4.14"
factory-boy = "^3.3"
ruff = "^0.17"
pre-commit = "^4.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 119
target-version = "py315"
extend-exclude = ["staticfiles", "media", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
# E501 — длину строк держит форматтер; DJ001/DJ012 — требуют миграций/перестановок в моделях (бэклог)
ignore = ["E501", "DJ001", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "W", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests.py", "test_*.py", "tests/*.py"]
addopts = "-ra --reuse-db"
