[tool.poetry]
name = "sport-school"
version = "0.1.0"
description = ""
authors = ["kirill_barkhatov <k.s.barkhatov@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.2"
psycopg2-binary = "^2.9.10"
python-dotenv = "^1.0.1"
pillow = "^12.1.1"
python-telegram-bot = "^22.6"
djangorestframework = "^3.15.2"
django-filter = "^25.2"
gunicorn = "^25.1.0"
django-cors-headers = "^4.4.0"
packaging = "^26.0"
celery = "^5.4.0"
redis = "^7.2.0"
requests = "^2.32.3"
pyjwt = "^2.10.1"
django-storages = "^1.14.3"
boto3 = "^1.35.43"


[tool.poetry.group.dev.dependencies]
ipython = "^9.10.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^24.10.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 119
