<style>
    .sidebar {
        min-height: 100vh;
    }
</style>

<div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
    <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu"
         aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarMenuLabel">Сервис управления рассылками</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"
                    aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
            <nav class="nav flex-column mb-auto">
                <a class="nav-link d-flex align-items-center gap-2 {% if request.resolver_match and request.resolver_match.url_name == 'index' %}active{% endif %}"
                   href="{% url 'school:index' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#house-fill"/>
                    </svg>
                    Главная
                </a>
                <a class="nav-link d-flex align-items-center gap-2" href="{% url 'members:members_list' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#people"/>
                    </svg>
                    Члены клуба
                </a>
                <a class="nav-link d-flex align-items-center gap-2" href="{% url 'school:athlete_list' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#people"/>
                    </svg>
                    Спортсмены
                </a>
                <a class="nav-link d-flex align-items-center gap-2" href="{% url 'groups:group_list' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#collection"/>
                    </svg>
                    Группы
                </a>
                <a class="nav-link d-flex align-items-center gap-2" href="{% url 'classes:class_list' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#file-earmark-text"/>
                    </svg>
                    Занятия
                </a>
                <a class="nav-link d-flex align-items-center gap-2" href="{% url 'notifications:notification_list' %}">
                    <svg class="bi">
                        <use xlink:href="/static/svg/icons-menu.svg#chat"/>
                    </svg>
                    Уведомления
                </a>
            </nav>

            <hr class="my-3">

            <div class="px-3 pb-3">
                {% if user.is_authenticated %}
                    <p class="small text-muted mb-2">
                        Вошли как {{ user.tg_first_name|default:user.email }}
                    </p>
                    <form method="post" action="{% url 'users:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary w-100">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a class="btn btn-primary w-100" href="{% url 'users:login_page' %}">
                        Войти через Telegram
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
