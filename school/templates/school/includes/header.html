<header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="{% url 'school:index' %}">Центр управления школой</a>

    <!--    Адаптив для мобильных устройств-->
    <ul class="navbar-nav flex-row d-md-none">
        <li class="nav-item text-nowrap">
            <button class="nav-link px-3 text-white" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSearch" aria-controls="navbarSearch" aria-expanded="false"
                    aria-label="Toggle search">
                <svg class="bi">
                    <use xlink:href="/static/svg/icons-menu.svg#search"/>
                </svg>
            </button>
        </li>
        <li class="nav-item text-nowrap">
            <button class="nav-link px-3 text-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                <svg class="bi">
                    <use xlink:href="/static/svg/icons-menu.svg#list"/>
                </svg>
            </button>
        </li>
    </ul>

    <div class="d-none d-md-flex align-items-center text-white ms-auto me-3 small gap-3">
        {% if user.is_authenticated %}
            <span class="opacity-75">{% if user.is_staff %}Администратор{% elif user.is_approved %}Участник{% else %}Ожидание подтверждения{% endif %}</span>
            <strong>{{ user.get_full_name|default:user.email }}</strong>
        {% endif %}
    </div>
</header>
