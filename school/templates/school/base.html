<body>

{% include 'school/includes/light_mode_menu.html' %}

{% include 'school/includes/header.html' %}



<div class="container-fluid">
    <div class="row">
        {% include 'school/includes/menu.html' %}

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

            {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}{% endblock %}

            {% block content_2 %}{% endblock %}

        </main>
    </div>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/toasts.js"></script>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" style="z-index: 1100;" aria-live="polite" aria-atomic="true"></div>

</body>
