{% extends 'school/base.html' %}

{% block title %}Удалить группу{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Вы уверены, что хотите удалить группу {{ object.name }}?</p>
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'groups:group_list' %}">Отмена</a>
</form>
{% endblock %}
