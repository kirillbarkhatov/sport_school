{% load static %}<!doctype html>
<html lang="ru" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ state.title }} — онлайн-результаты</title>
    <script src="{% static 'js/color-modes.js' %}"></script>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        summary { cursor: pointer; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .results-table td, .results-table th { white-space: nowrap; }
    </style>
</head>
<body class="bg-body">
<main class="container-lg py-3">
    <div id="live-root" data-version="{{ event.version }}" data-url="{{ fragment_url }}">
        {% include "results/_live_body.html" %}
    </div>
</main>
{% include "results/_live_script.html" %}
</body>
</html>
