services:
  web:
    build: .
    command: sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "python manage.py check --fail-level WARNING" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build: .
    command: poetry run python tg_bot/bot.py
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      web:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    command: poetry run celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always

  celery_beat:
    build: .
    command: poetry run celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always

volumes:
  redis_data: