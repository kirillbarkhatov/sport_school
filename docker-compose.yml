services:
  web:
    build: .
    command: sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env

  bot:
    build: .
    command: poetry run python tg_bot/bot.py
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - web

volumes:
  static_volume: